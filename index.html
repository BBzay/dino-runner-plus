<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="A vibrant 3D endless runner with 5 characters, power-ups, and procedural audio. Built with Three.js." />
  <meta property="og:title" content="Dino Runner Plus 3D" />
  <meta property="og:description" content="Dodge, jump, and duck through a colorful 3D world with 5 unlockable dinos, power-ups, and chip-tune music." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Dino Runner Plus 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 4 / 1.2;
      touch-action: none;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(100, 200, 255, 0.15);
    }
    #game-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #rotate-prompt {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #1a1a2e; z-index: 9999;
      flex-direction: column; align-items: center; justify-content: center;
      color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; text-align: center;
    }
    #rotate-prompt span { font-size: 48px; margin-bottom: 16px; }
    #rotate-prompt p { font-size: 16px; opacity: 0.7; }
    @media (max-width: 600px) and (orientation: portrait) {
      #rotate-prompt { display: flex; }
      #game-container { display: none; }
    }
  </style>
</head>
<body>
  <div id="rotate-prompt">
    <span>&#x1F504;</span>
    <p>Rotate your device to landscape to play</p>
  </div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
